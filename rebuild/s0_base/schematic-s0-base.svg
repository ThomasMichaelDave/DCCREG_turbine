<text x="600" y="100" class="t" font-weight="bold">Parts</text>
<text x="600" y="120" class="t" >C1 (1–REF), C2 (4–REF): varicaps in antiphase,</text>
<text x="600" y="140" class="t" >    C1 + C2 constant</text>
<text x="600" y="160" class="t" >Ca (1–2), Cb (3–4): fixed transfer capacitors</text>
<text x="600" y="180" class="t" >D1 REF→2, D2 REF→3, D3 3→1, D4 2→4</text>
<text x="600" y="210" class="t" font-weight="bold">Example values (the paper's)</text>
<text x="600" y="230" class="t" >C1, C2 60–360 pF; Ca = Cb = 330 pF; 20 Hz</text>
<text x="600" y="260" class="t" font-weight="bold">Startup gain (ideal diodes)</text>
<text x="600" y="280" class="t" >z = 1.372169 per cycle; √z = 1.171396 per half</text>
<text x="600" y="300" class="t" >e21/e11 = 0.159672; e41/e11 = 2.24118</text>
<text x="600" y="320" class="m" >paper: √z 1.17138, a 0.159674, b 2.24117</text>
<text x="600" y="340" class="m" >ngspice (near-ideal ND): z 1.372037 (-0.0096 %)</text>
<text x="600" y="370" class="t" font-weight="bold">Stage 0 scope</text>
<text x="600" y="390" class="m" >Topology only. Values, polarity, clamps Z1 / Z4, strays</text>
<text x="600" y="410" class="m" >and real diodes enter in Stage 1 (rebuild/README.md).</text>
<text x="20" y="480" class="m" >Source: A. C. M. de Queiroz, "Analysis of Electronic Electrostatic Generators", Fig. 1 (docs/reference/). Numbers: rebuild/s0_base/s0_base_results.json.</text>
<text x="20" y="498" class="m" >Drawn by rebuild/s0_base/make_schematic.py from s0_base.TOPOLOGY.</text>
</svg>
