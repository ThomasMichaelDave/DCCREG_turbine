<text x="644" y="120" class="m" >Limiter at nodes 1 / 4 (purple): an avalanche clamp (diodes only) OR a 20 kV spark gap</text>
<text x="644" y="136" class="m" >with a quench diode (drawn), which dumps C1 / C2 through its cone.</text>
<text x="650" y="654" class="m" >diodes only: cone 1.7 mA rms (0.12 A-turns peak) — negligible</text>
<text x="650" y="672" class="m" >spark-gap dump: cone 21 A peak, 683 A-turns, ~60 dumps/s per side,</text>
<text x="650" y="690" class="m" >~54 mJ each, ring 1.8 MHz; pump belt 6.8 W at 600 rpm relative</text>
<text x="20" y="775" class="m" >(a) design point: L ratio 8 (toothed poles), τ = L/R 0.118 s, 3 coils × 1150 t per group, AH rewound to 160 t: utron current 1.0–2.7 A, AH 157–425 A-turns (rod limit ≈ 600).</text>
<text x="20" y="793" class="m" >     Growth stops at iron saturation (B 1.35 T). Belt 144 W, copper 142 W on the rotor (currents scale with the core's saturation flux, power with its square).</text>
<text x="20" y="811" class="m" >     Threshold: L ratio ≳ 3 and τ ≳ 0.08 s at 60 Hz; dual nodes carry 10 nF + 1 kΩ snubbers (winding capacitance) [IR].</text>
<text x="20" y="829" class="m" >(b) cones sit on the rotor side of C1 / C2 (R-A / R-B → cone → shaft): no rotating contact; the ES nodes live on the stator vanes.</text>
<text x="20" y="847" class="m" >Numbers: sim/magnetic_doubler_results.json, sim/bicone_drive_results.json · findings: sim/hub-drive-findings.md · generator: docs/make_schematic_hub.py</text>
