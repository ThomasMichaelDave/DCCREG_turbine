<text x="20" y="28" class="h" >Central cavity driven by two pumps — rotor and stator geared 1 : −1 (300 rpm each, 600 rpm relative)</text>
<text x="20" y="48" class="m" >(a) AH pair ← magnetic dual doubler on the rotor (wound utrons vs the stator's toothed C-EM iron) · (b) bicone ← electrostatic diode doubler. Only diodes switch; the gap in (b) is the optional dump test.</text>
<rect x="20" y="70" width="560" height="680" class="box"/>
<text x="30" y="92" class="h2" >(a) MAGNETIC doubler → AH pair (pulsed, A / B in antiphase)</text>
<rect x="620" y="70" width="560" height="680" class="box"/>
<text x="630" y="92" class="h2" >(b) ELECTROSTATIC doubler → bicone cones</text>
