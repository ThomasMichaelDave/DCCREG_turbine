<text x="20.0" y="30.0" class="h" text-anchor="start" >DCCREG turbine: the rings' DC supply of record, the symmetric pair (each ring on its own chain from the shaft)</text>
<text x="20.0" y="52.0" class="m" text-anchor="start" >Ring B on 2 positive Cockcroft-Walton stages driven by the pump's node 4, ring A on the mirror image driven by node 1; both chains stand on the shaft (REF), which the AH and the null share. 100 pF storage, 100 GΩ per ring.</text>
