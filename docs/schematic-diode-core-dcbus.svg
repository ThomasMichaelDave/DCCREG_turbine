<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" font-family="DejaVu Sans, Arial, sans-serif" font-size="13">
  <title>Diode core with DC bus and C-EM drive</title>
  <rect width="1200" height="760" fill="#ffffff"/>
  <style>
    .w{stroke:#111;stroke-width:2;fill:none}
    .new{stroke:#c0392b;stroke-width:2.4;fill:none}
    .dr{stroke:#1f6fb2;stroke-width:2.2;fill:none}
    .t{fill:#111}
    .tn{fill:#c0392b}
    .td{fill:#1f6fb2}
    .m{fill:#666;font-size:11.5px}
    .h{font-size:16px;font-weight:bold;fill:#111}
    .box{stroke:#999;stroke-dasharray:5 4;fill:none}
    .dot{fill:#111}
  </style>
  <text x="20" y="28" class="h">Diode machine (de Queiroz core, no flying bucket) — DC bus and C-EM drive</text>
  <rect x="640" y="8" width="545" height="28" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="650" y="27" class="tn" font-weight="bold">SUPERSEDED: this drive needs switches. See schematic-diode-core-switchless.svg</text>
  <text x="20" y="48" class="m">black = existing core (solveDoubler4 topology) · red = NEW DC bus parts · blue = NEW C-EM drive (DC-tap ruling) · polarity as the engine's negative mode (all nodes ≤ 0)</text>

  <!-- rotor rail / reference -->
  <line x1="60" y1="660" x2="1140" y2="660" class="w"/>
  <text x="60" y="682" class="t">REF = rotor rail R-A (≈ R-B through the hub coil L1) — grounded by a shaft brush</text>

  <!-- ===== CORE (left) ===== -->
  <rect x="40" y="70" width="560" height="560" class="box"/>
  <text x="50" y="88" class="m">CORE (unchanged): C1, C2, Ca, Cb, Cpar + D1–D4</text>

  <!-- node rails -->
  <!-- node 1 at x=140, node 2 at x=260, node 3 at x=380, node 4 at x=500 ; top bus y=140 -->
  <!-- C1 variable: node1 to ref -->
  <line x1="140" y1="150" x2="140" y2="400" class="w"/>
  <line x1="120" y1="400" x2="160" y2="400" class="w"/><line x1="120" y1="412" x2="160" y2="412" class="w"/>
  <line x1="112" y1="425" x2="168" y2="388" class="w"/><polygon points="168,388 158,390 163,397" fill="#111"/>
  <line x1="140" y1="412" x2="140" y2="660" class="w"/>
  <text x="78" y="410" class="t">C1(θ)</text>
  <!-- C2 variable: node4 to ref -->
  <line x1="500" y1="150" x2="500" y2="400" class="w"/>
  <line x1="480" y1="400" x2="520" y2="400" class="w"/><line x1="480" y1="412" x2="520" y2="412" class="w"/>
  <line x1="472" y1="425" x2="528" y2="388" class="w"/><polygon points="528,388 518,390 523,397" fill="#111"/>
  <line x1="500" y1="412" x2="500" y2="660" class="w"/>
  <text x="530" y="410" class="t">C2(θ)</text>
  <!-- node dots + labels -->
  <circle cx="140" cy="150" r="4" class="dot"/><text x="118" y="140" class="t">node 1</text>
  <circle cx="500" cy="150" r="4" class="dot"/><text x="478" y="140" class="t">node 4</text>
  <!-- Ca between 1 and 2 (horizontal at y=220) -->
  <line x1="140" y1="220" x2="194" y2="220" class="w"/>
  <line x1="194" y1="204" x2="194" y2="236" class="w"/><line x1="206" y1="204" x2="206" y2="236" class="w"/>
  <line x1="206" y1="220" x2="260" y2="220" class="w"/><text x="186" y="198" class="t">Ca</text>
  <circle cx="140" cy="220" r="3.5" class="dot"/>
  <!-- Cb between 3 and 4 -->
  <line x1="380" y1="220" x2="434" y2="220" class="w"/>
  <line x1="434" y1="204" x2="434" y2="236" class="w"/><line x1="446" y1="204" x2="446" y2="236" class="w"/>
  <line x1="446" y1="220" x2="500" y2="220" class="w"/><text x="428" y="198" class="t">Cb</text>
  <circle cx="500" cy="220" r="3.5" class="dot"/>
  <!-- node 2 and node 3 verticals -->
  <line x1="260" y1="220" x2="260" y2="520" class="w"/><circle cx="260" cy="220" r="4" class="dot"/><text x="268" y="214" class="t">node 2</text>
  <line x1="380" y1="220" x2="380" y2="520" class="w"/><circle cx="380" cy="220" r="4" class="dot"/><text x="318" y="214" class="t">node 3</text>
  <!-- D1: node2 -> ref (anode node2 top, cathode ref bottom): triangle pointing down -->
  <polygon points="248,520 272,520 260,540" fill="none" stroke="#111" stroke-width="2"/><line x1="248" y1="540" x2="272" y2="540" class="w"/>
  <line x1="260" y1="540" x2="260" y2="660" class="w"/><text x="276" y="536" class="t">D1</text>
  <!-- D2: node3 -> ref -->
  <polygon points="368,520 392,520 380,540" fill="none" stroke="#111" stroke-width="2"/><line x1="368" y1="540" x2="392" y2="540" class="w"/>
  <line x1="380" y1="540" x2="380" y2="660" class="w"/><text x="396" y="536" class="t">D2</text>
  <!-- D3: node1 -> node3 (horizontal at y=300) -->
  <line x1="140" y1="300" x2="300" y2="300" class="w"/><circle cx="140" cy="300" r="3.5" class="dot"/>
  <polygon points="300,288 300,312 320,300" fill="none" stroke="#111" stroke-width="2"/><line x1="320" y1="288" x2="320" y2="312" class="w"/>
  <line x1="320" y1="300" x2="380" y2="300" class="w"/><circle cx="380" cy="300" r="3.5" class="dot"/><text x="300" y="282" class="t">D3</text>
  <!-- D4: node4 -> node2 (horizontal at y=360, pointing left) -->
  <line x1="500" y1="360" x2="340" y2="360" class="w"/><circle cx="500" cy="360" r="3.5" class="dot"/>
  <polygon points="340,348 340,372 320,360" fill="none" stroke="#111" stroke-width="2"/><line x1="320" y1="348" x2="320" y2="372" class="w"/>
  <line x1="320" y1="360" x2="260" y2="360" class="w"/><circle cx="260" cy="360" r="3.5" class="dot"/><text x="322" y="342" class="t">D4</text>
  <rect x="52" y="560" width="410" height="64" fill="#fff" stroke="#ddd"/>
  <text x="60" y="577" class="m">+ Cpar (~20 pF) from each node to REF</text>
  <text x="60" y="593" class="m">D1/D2 ≥ 20 kV, D3/D4 ≥ 40 kV (2CL77 ×1 / ×2); C-EMs NOT in D1/D2 paths</text>
  <text x="60" y="609" class="m">removed: Cx/Lx islands, SG1–SG4, BS3/BS4, clocking decks</text>

  <!-- ===== DC BUS (middle, red) ===== -->
  <!-- tap wires from node 1 and node 4 along y=110 -->
  <line x1="140" y1="150" x2="140" y2="110" class="new"/>
  <line x1="500" y1="150" x2="500" y2="110" class="new"/>
  <!-- D5 from bus to node 1: anode bus (right), cathode node 1 (left): arrow pointing left -->
  <line x1="140" y1="110" x2="200" y2="110" class="new"/>
  <polygon points="240,98 240,122 220,110" fill="none" stroke="#c0392b" stroke-width="2.4"/><line x1="220" y1="98" x2="220" y2="122" class="new"/>
  <text x="222" y="136" class="tn">D5</text>
  <rect x="250" y="102" width="40" height="16" fill="none" stroke="#c0392b" stroke-width="2"/><text x="258" y="96" class="tn" font-size="11">R_s</text>
  <line x1="200" y1="110" x2="220" y2="110" class="new"/><line x1="240" y1="110" x2="250" y2="110" class="new"/>
  <line x1="290" y1="110" x2="660" y2="110" class="new"/>
  <!-- D6 from bus to node 4 -->
  <line x1="500" y1="110" x2="520" y2="110" class="new" opacity="0"/>
  <polygon points="560,98 560,122 540,110" fill="none" stroke="#c0392b" stroke-width="2.4"/><line x1="540" y1="98" x2="540" y2="122" class="new"/>
  <text x="532" y="136" class="tn">D6</text>
  <rect x="570" y="102" width="40" height="16" fill="#fff" stroke="#c0392b" stroke-width="2"/><text x="572" y="96" class="tn" font-size="11">R_s</text>
  <line x1="500" y1="110" x2="540" y2="110" class="new"/>
  <!-- bus node -->
  <circle cx="660" cy="110" r="5" fill="#c0392b"/>
  <text x="630" y="92" class="tn" font-weight="bold">DC BUS (−V_op)</text>
  <line x1="660" y1="110" x2="660" y2="160" class="new"/>
  <!-- C_bus -->
  <line x1="640" y1="300" x2="680" y2="300" class="new"/><line x1="640" y1="312" x2="680" y2="312" class="new"/>
  <line x1="660" y1="160" x2="660" y2="300" class="new"/><line x1="660" y1="312" x2="660" y2="660" class="new"/>
  <text x="600" y="296" class="tn">C_bus</text><text x="584" y="330" class="m">5–10 nF, ≥30 kV</text>
  <!-- bleeder -->
  <line x1="660" y1="200" x2="720" y2="200" class="new"/><rect x="712" y="230" width="16" height="50" fill="none" stroke="#c0392b" stroke-width="2"/>
  <line x1="720" y1="200" x2="720" y2="230" class="new"/><line x1="720" y1="280" x2="720" y2="660" class="new"/>
  <text x="732" y="252" class="tn">R_bleed</text><text x="732" y="268" class="m">≥10 GΩ</text>
  <!-- OV clamp -->
  <line x1="720" y1="170" x2="790" y2="170" class="new"/><line x1="660" y1="170" x2="720" y2="170" class="new"/>
  <circle cx="790" cy="300" r="9" fill="none" stroke="#c0392b" stroke-width="2"/><circle cx="790" cy="324" r="9" fill="none" stroke="#c0392b" stroke-width="2"/>
  <line x1="790" y1="170" x2="790" y2="291" class="new"/><line x1="790" y1="333" x2="790" y2="660" class="new"/>
  <text x="802" y="306" class="tn">OV gap</text><text x="802" y="322" class="m">1.2 × V_op, in air</text>
  <circle cx="660" cy="660" r="4" class="dot"/><circle cx="720" cy="660" r="4" class="dot"/><circle cx="790" cy="660" r="4" class="dot"/>

  <!-- ===== C-EM DRIVE (right, blue) ===== -->
  <rect x="840" y="70" width="340" height="560" class="box"/>
  <text x="850" y="88" class="m">C-EM DRIVE on the bus (stator side, outside vacuum)</text>
  <line x1="660" y1="110" x2="1010" y2="110" class="dr"/>
  <line x1="1010" y1="110" x2="1010" y2="130" class="dr"/>
  <!-- series string of 12 coil cells -->
  <g>
    <rect x="960" y="130" width="100" height="420" fill="none" stroke="#1f6fb2" stroke-width="1.5" stroke-dasharray="3 3"/>
  </g>
  <!-- draw 6 representative cells (A1..A6 / B1..B6 lumped as two columns of text) -->
  <g class="dr">
    <path d="M1010 140 q8 6 0 12 q8 6 0 12 q8 6 0 12 q8 6 0 12"/>
    <line x1="1010" y1="188" x2="1010" y2="200"/>
    <rect x="1000" y="200" width="20" height="18"/>
    <line x1="1010" y1="218" x2="1010" y2="232"/>
    <path d="M1010 232 q8 6 0 12 q8 6 0 12 q8 6 0 12 q8 6 0 12"/>
    <line x1="1010" y1="280" x2="1010" y2="292"/>
    <rect x="1000" y="292" width="20" height="18"/>
    <line x1="1010" y1="310" x2="1010" y2="360" stroke-dasharray="3 4"/>
    <path d="M1010 360 q8 6 0 12 q8 6 0 12 q8 6 0 12 q8 6 0 12"/>
    <line x1="1010" y1="408" x2="1010" y2="420"/>
    <rect x="1000" y="420" width="20" height="18"/>
    <line x1="1010" y1="438" x2="1010" y2="550"/>
  </g>
  <text x="868" y="166" class="td">C-EM A1</text><text x="868" y="214" class="td">switch S1</text>
  <text x="868" y="258" class="td">C-EM A2</text><text x="868" y="306" class="td">switch S2</text>
  <text x="868" y="340" class="m">… A3–B5 …</text>
  <text x="868" y="386" class="td">C-EM B6</text><text x="868" y="434" class="td">switch S12</text>
  <line x1="1010" y1="550" x2="1010" y2="660" class="dr"/><circle cx="1010" cy="660" r="4" class="dot"/>
  <text x="1068" y="200" class="m">each cell:</text>
  <text x="1068" y="216" class="m">coil + switch</text>
  <text x="1068" y="232" class="m">(~2 kV SiC,</text>
  <text x="1068" y="248" class="m">optical gate)</text>
  <text x="1068" y="264" class="m">+ freewheel D</text>
  <text x="1068" y="280" class="m">+ bleeder R</text>
  <!-- position sensor + controller -->
  <rect x="860" y="470" width="90" height="60" fill="none" stroke="#1f6fb2" stroke-width="2"/>
  <text x="868" y="492" class="td">rotor-pos.</text><text x="868" y="508" class="td">sensor +</text><text x="868" y="524" class="td">controller</text>
  <line x1="950" y1="500" x2="1000" y2="430" class="dr" stroke-dasharray="4 3"/><line x1="950" y1="500" x2="1000" y2="300" class="dr" stroke-dasharray="4 3"/>
  <line x1="950" y1="500" x2="1000" y2="210" class="dr" stroke-dasharray="4 3"/>
  <text x="850" y="566" class="m">12 coils (A ×6, B ×6) in ONE series string</text>
  <text x="850" y="582" class="m">across the bus; PM utrons on the rotor;</text>
  <text x="850" y="598" class="m">winding ≈ 6200 t / 0.20 mm so the string</text>
  <text x="850" y="614" class="m">back-EMF ≈ V_op at the design rpm</text>

  <text x="20" y="712" class="m">Bus voltage is set by the load: the drive draws only the surplus (voltage-priority control); without it the bus floats up to the OV gap. R_s 10–47 kΩ limits surge into D5/D6.</text>
  <text x="20" y="730" class="m">D5/D6 reverse rating ≥ 2 × V_op (node swing + bus). Ripple at 30 cycles/s, 150 µA, 10 nF ≈ 500 V. Not yet engine-verified with the bus attached (gate G-LOAD).</text>
</svg>
