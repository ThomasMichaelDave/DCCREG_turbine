<text x="150.0" y="419.6" text-anchor="end" font-size="12" fill="#1a1a1a" stroke="none">keyed in its hub</text>
<line x1="328.0" y1="455.2" x2="154.0" y2="455.2" stroke="#4d4d4d" stroke-width="0.8"/>
