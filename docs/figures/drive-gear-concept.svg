<text x="681.6" y="214.0" text-anchor="start" font-size="12" fill="#1a1a1a" stroke="none">end disc, G10 10 mm: the bottom</text>
<text x="681.6" y="229.0" text-anchor="start" font-size="12" fill="#1a1a1a" stroke="none">spider re-purposed (new role)</text>
<line x1="478.8" y1="218.6" x2="677.6" y2="276.6" stroke="#4d4d4d" stroke-width="0.8"/>
<text x="681.6" y="280.6" text-anchor="start" font-size="12" fill="#1a1a1a" stroke="none">hub with the gear-end inner bearing</text>
<text x="681.6" y="295.6" text-anchor="start" font-size="12" fill="#1a1a1a" stroke="none">6205-2Z (1200 rpm relative)</text>
<line x1="460.6" y1="268.0" x2="677.6" y2="350.0" stroke="#4d4d4d" stroke-width="0.8"/>
<text x="681.6" y="354.0" text-anchor="start" font-size="12" fill="#1a1a1a" stroke="none">side gear z 30, m 2, stainless</text>
<text x="681.6" y="369.0" text-anchor="start" font-size="12" fill="#1a1a1a" stroke="none">(the counter-rotor's)</text>
<line x1="468.4" y1="291.4" x2="677.6" y2="400.6" stroke="#4d4d4d" stroke-width="0.8"/>
<text x="681.6" y="404.6" text-anchor="start" font-size="12" fill="#1a1a1a" stroke="none">POM pinion z 20, x 3 at 120 deg,</text>
<text x="681.6" y="419.6" text-anchor="start" font-size="12" fill="#1a1a1a" stroke="none">on a stub shaft in 2 x 6000-2Z</text>
