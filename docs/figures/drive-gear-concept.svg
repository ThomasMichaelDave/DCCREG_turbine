<text x="1000.0" y="572.6" text-anchor="middle" font-size="12" fill="#1a1a1a" stroke="none">20T</text>
<text x="772.8" y="499.2" text-anchor="middle" font-size="12" fill="#1a1a1a" stroke="none">HTD 5M belt, 15 mm, 750 mm; ratio 4 : 1; centres 245 mm</text>
<text x="772.8" y="561.6" text-anchor="middle" font-size="12" fill="#4d4d4d" stroke="none">motor plate slotted for the tension</text>
<text x="681.6" y="122.0" text-anchor="start" font-size="12" fill="#1a1a1a" stroke="none" font-weight="bold">counter-rotor, -600 rpm</text>
