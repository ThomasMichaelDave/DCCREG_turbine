<text x="162.0" y="652.6" text-anchor="start" font-size="12" fill="#4d4d4d" stroke="none">base plate (frame); the columns up to the top end bearing are not drawn</text>
<text x="20.0" y="678.6" text-anchor="start" font-size="12" fill="#1a1a1a" stroke="none" font-weight="bold">Steady, 600 rpm each way</text>
<text x="20.0" y="696.6" text-anchor="start" font-size="12" fill="#1a1a1a" stroke="none">pumps between the bodies 0.171 N m (1200 rpm relative)</text>
<text x="20.0" y="714.6" text-anchor="start" font-size="12" fill="#1a1a1a" stroke="none">  swinging -0.71 .. 1.45 N m at 120 / 240 Hz</text>
<text x="20.0" y="732.6" text-anchor="start" font-size="12" fill="#1a1a1a" stroke="none">with bearings and 25 W of windage 0.40 N m</text>
<text x="20.0" y="750.6" text-anchor="start" font-size="12" fill="#1a1a1a" stroke="none">gear on each body 0.48 N m; frame (carrier) 1.00 N m</text>
<text x="560.0" y="678.6" text-anchor="start" font-size="12" fill="#1a1a1a" stroke="none" font-weight="bold">Drive</text>
<text x="560.0" y="696.6" text-anchor="start" font-size="12" fill="#1a1a1a" stroke="none">belt at the shaft 0.94 N m, 59 W; motor 61 W</text>
<text x="560.0" y="714.6" text-anchor="start" font-size="12" fill="#1a1a1a" stroke="none">run-up to 600 rpm 32 s at the motor's rated torque</text>
<text x="560.0" y="732.6" text-anchor="start" font-size="12" fill="#1a1a1a" stroke="none">gear peak 1.6 N m (run-up); ripple 0.06 N m p-p</text>
<text x="560.0" y="750.6" text-anchor="start" font-size="12" fill="#1a1a1a" stroke="none">the ripple stays in the bodies: the gear-path mode is 20 Hz</text>
