<text x="20" y="48" class="m" >black = core (solveDoubler4 netlist: D1 2→ref, D2 3→ref, D3 1→3, D4 4→2, anode→cathode) · blue = C-EM strings (PM utrons) · purple = avalanche clamp · red = bus parts</text>
<text x="20" y="64" class="m" >Negative polarity (all nodes ≤ 0). No transistor, thyristor, spark gap, commutator or controller anywhere: every one-way element is a diode. Wires that cross without a dot are not connected.</text>
