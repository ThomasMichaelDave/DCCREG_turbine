<text x="20" y="730" class="m" >(a) design point k 20 (≈ 36920 turns per coil, string EMF 5.6 kV pk), flux extreme at plate alignment: 4.31 W to the shaft, 137 mN·m; belt 11.4 W, clamp 6.8 W, copper 0.29 W.</text>
<text x="20" y="748" class="m" >     Stator: pump reaction 363 mN·m + drag 14.7 mN·m → net -241 mN·m (dragged along, as for every pump-fed motor). k 10: 2.1 W; k 40: copper and clamp take over.</text>
<text x="20" y="766" class="m" >(b) bus, k 1: -0.24 mN·m (once C_bus is charged only the 2 µA bleed flows through D5 / D6); k 20: −99 mN·m, a brake (the PM EMF drives 3.1 W into the snubbers); at two phases the pump collapses.</text>
<text x="20" y="784" class="m" >     Without switches a DC bus cannot turn the coils (constant current, periodic flux → zero average torque) [OC].</text>
<text x="20" y="802" class="m" >Z1 / Z4: avalanche-diode strings (BV 20 kV, soft knee, ~100 kΩ): they set the operating voltage and take the surplus the coils don't.</text>
<text x="20" y="820" class="m" >     Without them the pump runs away at every rewind (coil power ∝ V, pump surplus ∝ V²).</text>
<text x="20" y="838" class="m" >Coil timing comes from the plates alone: each coil must see 6 flux periods per rev (one per pump cycle), so 6 PM utrons per side.</text>
<text x="20" y="856" class="m" >     The present 3 utrons per side give ≈ 0 average torque. Each string floats at node potential: coil insulation ≥ 20 kV.</text>
<text x="20" y="874" class="m" >ngspice, tube defaults at 300 rpm: near-ideal diodes, cosine varicaps, PM swing 0.27 mWb per coil [RH, gate G-SWING open].</text>
<text x="20" y="892" class="m" >     Numbers: sim/switchless_cem_results.json · findings: sim/switchless-cem-findings.md · generator: docs/make_schematic_switchless.py.</text>
