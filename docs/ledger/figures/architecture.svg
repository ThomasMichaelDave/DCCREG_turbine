<text x="20.0" y="32.0" class="h" text-anchor="start" >DCCREG turbine, the locked design (2026-10-09): what drives what</text>
<text x="20.0" y="54.0" class="m" text-anchor="start" >Two counter-rotating bodies on one shaft; on each shaft half a magnetic pump and an electrostatic pump; both pumps hold a static field at the hub's centre. Side A below, side B above, mirror images.</text>
<rect x="20" y="90" width="230" height="150" rx="6" fill="#f6f6f4" stroke="#999" stroke-width="1.4"/>
<text x="32.0" y="112.0" class="tk" text-anchor="start" style="fill:#111">DRIVE (the frame)</text>
<text x="32.0" y="132.0" class="tv" text-anchor="start" >drive motor and belt</text>
<text x="32.0" y="148.0" class="tv" text-anchor="start" >reversing gear 1 : −1</text>
<text x="32.0" y="164.0" class="tv" text-anchor="start" >end bearings, housings</text>
<text x="32.0" y="180.0" class="tv" text-anchor="start" >(a first cut, PROPOSED)</text>
<rect x="20" y="300" width="230" height="132" rx="6" fill="#ffffff" stroke="#5d6670" stroke-width="1.4"/>
<text x="32.0" y="322.0" class="tk" text-anchor="start" style="fill:#111">ROTOR, +600 rpm</text>
<text x="32.0" y="342.0" class="tv" text-anchor="start" >shaft (REF), sleeve, hub</text>
<text x="32.0" y="358.0" class="tv" text-anchor="start" >utrons, rotor vanes</text>
<text x="32.0" y="374.0" class="tv" text-anchor="start" >Ca / Cb, D1–D4, Z1 / Z4</text>
<text x="32.0" y="390.0" class="tv" text-anchor="start" >both pumps' circuits</text>
<rect x="20" y="470" width="230" height="116" rx="6" fill="#ffffff" stroke="#5d6670" stroke-width="1.4"/>
<text x="32.0" y="492.0" class="tk" text-anchor="start" style="fill:#111">COUNTER-ROTOR, −600 rpm</text>
<text x="32.0" y="512.0" class="tv" text-anchor="start" >stator cage, stator vanes</text>
<text x="32.0" y="528.0" class="tv" text-anchor="start" >(REF via one inner bearing)</text>
<text x="32.0" y="544.0" class="tv" text-anchor="start" >SiFe bridges, no wires</text>
<line x1="135.0" y1="240.0" x2="135.0" y2="286.0" stroke="#1d3f5e" stroke-width="2.2"/>
<polygon points="135.0,298.0 129.0,286.0 141.0,286.0" fill="#1d3f5e"/>
<text x="146.0" y="274.0" class="ms" text-anchor="start" >1200 rpm relative</text>
<line x1="135" y1="432" x2="135" y2="468" stroke="#5d6670" stroke-width="1.6" stroke-dasharray="4 3"/>
<text x="146.0" y="455.0" class="ms" text-anchor="start" >four inner bearings</text>
<text x="300.0" y="110.0" class="zh" text-anchor="start" >THE MAGNETIC PUMP: a reluctance machine, the planar dual of the electrostatic doubler</text>
<rect x="300" y="124" width="250" height="150" rx="6" fill="#eef3f8" stroke="#9fb3c8" stroke-width="1.4"/>
<text x="312.0" y="146.0" class="tk" text-anchor="start" style="fill:#111">Utrons × bridges</text>
<text x="312.0" y="166.0" class="tv" text-anchor="start" >3 wound utrons per side (rotor)</text>
<text x="312.0" y="182.0" class="tv" text-anchor="start" >6 SiFe bridges per side (counter)</text>
<text x="312.0" y="198.0" class="tv" text-anchor="start" >gap 0.5 mm, 120 Hz</text>
<text x="312.0" y="214.0" class="tv" text-anchor="start" >L 81 ↔ 9.4 mH per coil</text>
<rect x="590" y="124" width="250" height="150" rx="6" fill="#eef3f8" stroke="#9fb3c8" stroke-width="1.4"/>
<text x="602.0" y="146.0" class="tk" text-anchor="start" style="fill:#111">Magnetic dual doubler</text>
<text x="602.0" y="166.0" class="tv" text-anchor="start" >groups A / B in antiphase</text>
<text x="602.0" y="182.0" class="tv" text-anchor="start" >La / Lb 0.146 H, D1*–D4*</text>
<text x="602.0" y="198.0" class="tv" text-anchor="start" >clamp: the NiFe neck saturates</text>
<text x="602.0" y="214.0" class="tv" text-anchor="start" >kick start; z 1.14–1.21</text>
<rect x="880" y="124" width="220" height="150" rx="6" fill="#eef3f8" stroke="#9fb3c8" stroke-width="1.4"/>
<text x="892.0" y="146.0" class="tk" text-anchor="start" style="fill:#111">AH coil pair</text>
<text x="892.0" y="166.0" class="tv" text-anchor="start" >160 turns, one per branch</text>
<text x="892.0" y="182.0" class="tv" text-anchor="start" >22 mF bypass each (PROPOSED)</text>
<text x="892.0" y="198.0" class="tv" text-anchor="start" >300 A-turns, ±3 %</text>
<text x="892.0" y="214.0" class="tv" text-anchor="start" >belt 18.1 W + 1.25 W iron</text>
<line x1="550.0" y1="199.0" x2="578.0" y2="199.0" stroke="#1d3f5e" stroke-width="2.2"/>
<polygon points="590.0,199.0 578.0,205.0 578.0,193.0" fill="#1d3f5e"/>
<line x1="840.0" y1="199.0" x2="868.0" y2="199.0" stroke="#1d3f5e" stroke-width="2.2"/>
<polygon points="880.0,199.0 868.0,205.0 868.0,193.0" fill="#1d3f5e"/>
<text x="300.0" y="352.0" class="zh" text-anchor="start" >THE ELECTROSTATIC PUMP: the de Queiroz diode doubler, HV side on the rotor</text>
<rect x="300" y="366" width="250" height="166" rx="6" fill="#f3f0e6" stroke="#b9ad8a" stroke-width="1.4"/>
<text x="312.0" y="388.0" class="tk" text-anchor="start" style="fill:#111">Air vane stack C1 / C2</text>
<text x="312.0" y="408.0" class="tv" text-anchor="start" >6 + 6 vanes per side, Al 3 mm</text>
<text x="312.0" y="424.0" class="tv" text-anchor="start" >6 mm gaps, R1.5 full rounds</text>
<text x="312.0" y="440.0" class="tv" text-anchor="start" >rotor vanes = nodes 1 / 4</text>
<text x="312.0" y="456.0" class="tv" text-anchor="start" >stator vanes = REF</text>
<text x="312.0" y="472.0" class="tv" text-anchor="start" >55 ↔ 410 pF, 120 Hz</text>
<rect x="590" y="366" width="250" height="166" rx="6" fill="#f3f0e6" stroke="#b9ad8a" stroke-width="1.4"/>
<text x="602.0" y="388.0" class="tk" text-anchor="start" style="fill:#111">Diode doubler</text>
<text x="602.0" y="408.0" class="tv" text-anchor="start" >Ca / Cb 451 pF on the rotor</text>
<text x="602.0" y="424.0" class="tv" text-anchor="start" >D1–D4, self-exciting from a seed</text>
<text x="602.0" y="440.0" class="tv" text-anchor="start" >clamps Z1 / Z4 at 13.1 kV</text>
<text x="602.0" y="456.0" class="tv" text-anchor="start" >nodes 1 / 4: −13.2 ↔ −5.7 kV</text>
<text x="602.0" y="472.0" class="tv" text-anchor="start" >z 1.31 bare; belt 2.14 W</text>
<rect x="880" y="366" width="220" height="166" rx="6" fill="#f3f0e6" stroke="#b9ad8a" stroke-width="1.4"/>
<text x="892.0" y="388.0" class="tk" text-anchor="start" style="fill:#111">Two mirrored chains</text>
<text x="892.0" y="408.0" class="tv" text-anchor="start" >Cockcroft-Walton, 2 stages</text>
<text x="892.0" y="424.0" class="tv" text-anchor="start" >each, from the shaft</text>
<text x="892.0" y="440.0" class="tv" text-anchor="start" >node 1 → ring A −15.0 kV</text>
<text x="892.0" y="456.0" class="tv" text-anchor="start" >node 4 → ring B +15.0 kV</text>
<text x="892.0" y="472.0" class="tv" text-anchor="start" >8 diodes, 8 × 100 pF</text>
<line x1="550.0" y1="449.0" x2="578.0" y2="449.0" stroke="#1d3f5e" stroke-width="2.2"/>
<polygon points="590.0,449.0 578.0,455.0 578.0,443.0" fill="#1d3f5e"/>
