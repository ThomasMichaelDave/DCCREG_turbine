<text x="1291.0" y="334.0" class="te" text-anchor="start" >E</text>
<text x="1154.0" y="150.0" class="ms" text-anchor="start" >AH cores (MnZn) on the axis</text>
<text x="1154.0" y="166.0" class="ms" text-anchor="start" >ring B +15.0 kV (blue), A −15.0 kV (red)</text>
<text x="1154.0" y="498.0" class="ms" text-anchor="start" >50 mm borosilicate sphere, vacuum,</text>
<text x="1154.0" y="514.0" class="ms" text-anchor="start" >1.5 mm wall; PEEK retainer + 0.5 mm gel,</text>
<text x="1154.0" y="530.0" class="ms" text-anchor="start" >G10 coupler; flanges at |z| 72–80 mm</text>
<text x="1154.0" y="560.0" class="tk" text-anchor="start" >at the null:</text>
<text x="1154.0" y="578.0" class="tv" text-anchor="start" >B: the AH's steady cusp (the null)</text>
<text x="1154.0" y="596.0" class="tv" text-anchor="start" >E: 7.62 kV/cm, B to A, 2.57 Pa (8.2 settled)</text>
<text x="1154.0" y="614.0" class="ms" text-anchor="start" >(ripple 0.19 %, no sign change)</text>
<line x1="1100.0" y1="199.0" x2="1186.0" y2="255.4" stroke="#1d3f5e" stroke-width="2.2"/>
<polygon points="1196.0,262.0 1182.7,260.4 1189.3,250.4" fill="#1d3f5e"/>
