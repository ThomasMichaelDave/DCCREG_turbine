<polygon points="1196.0,398.0 1188.2,408.9 1182.6,398.3" fill="#1d3f5e"/>
<rect x="20" y="648" width="1402" height="186" rx="6" fill="#ffffff" stroke="#c3c2b7" stroke-width="1"/>
<text x="36.0" y="674.0" class="zh" text-anchor="start" >WHERE THE BELT'S POWER GOES (at 1200 rpm relative)</text>
<text x="36.0" y="702.0" class="tk" text-anchor="start" >magnetic pump</text>
<text x="186.0" y="702.0" class="tv" text-anchor="start" >18.1 W belt + 1.25 W iron: utron copper 13.5 W, AH coils 2.0 W, diodes 2.0 W, La / Lb 0.7 W; the bypass 8 mW</text>
<text x="36.0" y="726.0" class="tk" text-anchor="start" >electrostatic pump</text>
<text x="186.0" y="726.0" class="tv" text-anchor="start" >2.14 W belt, all into the clamps Z1 / Z4 (1.07 W each); the rings' leakage 4.5 mW at 100 GΩ per ring</text>
<text x="36.0" y="750.0" class="tk" text-anchor="start" >the mechanics</text>
<text x="186.0" y="750.0" class="tv" text-anchor="start" >windage about 12 W and the bearings 5 W, so about 39 W in all from the belt; the gear puts the same torque on both bodies, the frame takes twice it</text>
<text x="36.0" y="774.0" class="tk" text-anchor="start" >the products</text>
<text x="186.0" y="774.0" class="tv" text-anchor="start" >two static fields at the hub's centre: the AH's cusp (300 A-turns per coil) and the DC field 7.62 kV/cm (8.2 settled); no electrical output is drawn</text>
<text x="36.0" y="798.0" class="tk" text-anchor="start" >the reference</text>
<text x="186.0" y="798.0" class="tv" text-anchor="start" >the shaft (REF); the counter-rotor's stator vanes reach it through one inner bearing (0.41 mA rms, pure AC)</text>
<text x="36.0" y="822.0" class="tk" text-anchor="start" >not yet built in</text>
<text x="186.0" y="822.0" class="tv" text-anchor="start" >the gear and belt, La / Lb and the HV parts are not in the 3-D model; the record's stacks, hub, AH and rings are (see the ledger's register)</text>
<text x="20.0" y="858.0" class="n" text-anchor="start" >Sources: docs/ledger/DCCREG-design-ledger.md · generator: docs/ledger/make_ledger_figures.py</text>
