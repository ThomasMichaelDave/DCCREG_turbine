<polygon points="880.0,449.0 868.0,455.0 868.0,443.0" fill="#1d3f5e"/>
<rect x="1140" y="96" width="282" height="532" rx="8" fill="#fbfbfa" stroke="#1d3f5e" stroke-width="1.6"/>
<text x="1281.0" y="122.0" class="zh" text-anchor="middle" >THE HUB (rotor)</text>
